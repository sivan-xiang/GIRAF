<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      首屏底色：必须在任何样式表与脚本之前内联。
      深色站若等到 CSS 到达才上色，会先闪一帧白底；页眉是半透明毛玻璃，
      还会把那层白采样成一条导航栏高度的白带。此处的内联样式与 base.css 中的
      html{background:var(--bg)} 构成双保险，#080e1b 即设计令牌里的 --bg。
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #080e1b;
        color-scheme: dark;
      }
    </style>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080e1b" />
    <!--
      静态回退文案 = 主语言（英语）首页。
      运行时由 App.vue 依据当前路由与语言覆写 title / description / og:* / canonical。
      这里必须与英语站保持一致，否则首屏（脚本执行前）会闪现另一门语言的标题。
    -->
    <title>GIRAF | Simplify the cross-border trade</title>
    <meta
      name="description"
      content="GIRAF is the overseas brand of LONGSAIL International Logistics — ocean, air and rail freight, customs clearance and warehousing, delivered by our own companies in seven countries and backed by 30+ locations worldwide."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GIRAF Logistics" />
    <meta property="og:title" content="GIRAF | Simplify the cross-border trade" />
    <meta
      property="og:description"
      content="Ocean, air and rail freight, customs clearance and warehousing — delivered by our own companies in seven countries."
    />
    <!--
      分享图必须是绝对地址：Facebook / LinkedIn 等抓取器不执行 JS，也不解析相对路径。
      若最终上线域名不是 www.girafsail-logistics.com，需同步修改下面三处 URL。
      图片由 `npm run og` 生成（scripts/og-image.mjs，1200×630）。
    -->
    <meta property="og:image" content="https://www.girafsail-logistics.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GIRAF — Simplify the cross-border trade" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GIRAF | Simplify the cross-border trade" />
    <meta
      name="twitter:description"
      content="Ocean, air and rail freight, customs clearance and warehousing — delivered by our own companies in seven countries."
    />
    <meta name="twitter:image" content="https://www.girafsail-logistics.com/og-image.png" />
    <!--
      字体说明：刻意不使用 Google Fonts CDN。
      德国法院已判定「从 Google 服务器加载网页字体」属于未经同意的个人数据传输（DSGVO 风险）。
      本页面改用系统字体栈，零外部请求，因此除语言偏好外不写入任何 Cookie。
    -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
