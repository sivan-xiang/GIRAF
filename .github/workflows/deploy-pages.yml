name: Deploy to GitHub Pages

# 每次推送到 main 自动重建并发布；
# 也可在 Actions 页面手动触发（workflow_dispatch）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次发布，新的推送取消尚未完成的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 项目页部署在 /<repo>/ 子路径下，必须覆盖 vite.config.js 的默认 base，
      # 否则产出的资源引用是 /assets/*，在子路径下会 404。
      - name: Build
        run: VITE_BASE=/GIRAF/ npm run build

      # 纯静态托管上，SPA 深链（/GIRAF/services、/GIRAF/de/contact）默认返回 404。
      # 两步处理：
      #   1) static-routes.mjs 为每条路由写出实体 index.html → 深链返回 200；
      #   2) 404.html 兜底未知路径 → 仍由前端路由接管，不出现托管商的 404 页。
      - name: Materialise routes for static hosting
        run: node scripts/static-routes.mjs dist

      - uses: actions/configure-pages@v5
        with:
          # 若仓库尚未开启 Pages，尝试由工作流直接开启（无需手动点设置）。
          # 若权限不足会失败，此时需在 Settings → Pages 手动选 "GitHub Actions"。
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
