name: Deploy to GitHub Pages

# 每次推送到 main 自动重建并发布；也可在 Actions 页面手动触发（workflow_dispatch）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次发布，新推送会取消尚未完成的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 项目页部署在 /GIRAF/ 子路径下，必须覆盖 vite.config.js 的默认 base，
      # 否则产出的资源引用是 /assets/*，在子路径下会 404。
      - name: Build
        run: VITE_BASE=/GIRAF/ npm run build

      # 纯静态托管上 SPA 深链（/GIRAF/services、/GIRAF/de/contact）默认返回 404：
      #   1) static-routes.mjs 为每条路由写出实体 index.html → 深链返回 200；
      #   2) 404.html 兜底未知路径 → 不出现托管商的 404 页。
      - name: Materialise routes for static hosting
        run: node scripts/static-routes.mjs dist

      # ⚠️ 首次部署的已知边界：创建 Pages 站点需要**仓库管理员**权限，
      # 而 GITHUB_TOKEN 永远不具备该权限（报 Resource not accessible by integration）。
      # 因此首次运行会卡在此步 —— 需在 Settings → Pages → Source 手动选一次
      # "GitHub Actions"；此后每次推送都会全自动完成。
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
