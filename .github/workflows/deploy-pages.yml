name: Deploy to GitHub Pages

# 每次推送到 main 自动重建并发布；也可在 Actions 页面手动触发（workflow_dispatch）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次发布，新推送会取消尚未完成的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 项目页部署在 /GIRAF/ 子路径下，必须覆盖 vite.config.js 的默认 base，
      # 否则产出的资源引用是 /assets/*，在子路径下会 404。
      - name: Build
        run: VITE_BASE=/GIRAF/ npm run build

      # 纯静态托管上 SPA 深链（/GIRAF/services、/GIRAF/de/contact）默认返回 404：
      #   1) static-routes.mjs 为每条路由写出实体 index.html → 深链返回 200；
      #   2) 404.html 兜底未知路径 → 不出现托管商的 404 页。
      - name: Materialise routes for static hosting
        run: node scripts/static-routes.mjs dist

      # ⚠️ 已知边界：Pages 站点只能有一个来源，而「来源选错」时本工作流会**静默失效**。
      #    ✅ 正确：Settings → Pages → Build and deployment → Source = "GitHub Actions"
      #    ❌ 错误：Source = "Deploy from a branch"（main / root）
      #       → 站点直接托管仓库源码（/package.json、/src/main.js 均可在公网取到），
      #         浏览器拿到 <script src="/src/main.js"> 与裸模块名 'vue'，ES 模块解析失败，
      #         页面全白；而本工作流**仍会上报 success**（deploy-pages 不会因此报错）。
      # 判别方法：Actions 列表若同时存在 "pages build and deployment" 运行
      #   （path = dynamic/pages/pages-build-deployment），即仍处于分支模式。
      # 权限说明：该开关只有仓库管理员能在网页端切换，GITHUB_TOKEN 无此权限；
      #   configure-pages 的 enablement 只负责「新建」站点，
      #   **不会把已存在的分支站点改造成 workflow 模式**。
      # 切好后无需新推送：Actions → 选中本工作流 → Re-run all jobs 即可。
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
